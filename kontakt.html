    <main class="container">
        <h1 class="page-title">Kontakt</h1>

        <section class="contact-card contact-form-card" aria-labelledby="contact-form-heading">
            <h2 id="contact-form-heading">Nachricht senden</h2>

            <form class="contact-form" action="https://api.web3forms.com/submit" method="POST">
                <input type="hidden" name="access_key" value="ba53a7f7-e01a-420b-b4d1-ae889e865e39">
                <input type="hidden" name="from_name" value="Kempoka Ryu Website">
                <input class="form-honeypot" type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" aria-hidden="true">

                <div class="form-row">
                    <div class="field">
                        <label for="name">Vor- und Nachname</label>
                        <input id="name" name="name" type="text" placeholder="Dein Vor- und Nachname" autocomplete="name" required>
                    </div>

                    <div class="field">
                        <label for="email">E-Mail</label>
                        <input id="email" name="email" type="email" placeholder="deine@email.de" autocomplete="email" required>
                    </div>
                </div>

                <div class="field">
                    <label for="subject">Betreff</label>
                    <input id="subject" name="subject" type="text" placeholder="z. B. Informationen zum Training">
                </div>

                <div class="field">
                    <label for="message">Nachricht</label>
                    <textarea id="message" name="message" rows="6" placeholder="Schreib uns deine Frage oder dein Anliegen..." required></textarea>
                </div>

                <div class="form-actions">
                    <button class="button" type="submit">Nachricht senden</button>
                </div>
            </form>
        </section>
    </main>
