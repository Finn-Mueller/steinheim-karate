name: Update NRW holiday closures

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh school holidays and public holidays
        run: node scripts/update-holiday-closures.mjs
      - name: Commit updated holiday data
        run: |
          if git diff --quiet -- assets/data/holiday-closures.js; then
            echo "Holiday data is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/holiday-closures.js
          git commit -m "Update NRW holiday closures"
          git push
